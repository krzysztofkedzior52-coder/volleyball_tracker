<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Volleyball Stat Tracker</title>
<style>
:root{--bg:#0f1720;--panel:#18222e;--panel2:#233140;--line:#2c3b4c;--text:#eef3f8;--mut:#8fa3b8;--good:#1f9d5b;--bad:#c93a3f;--warn:#b7791f;--acc:#3b82f6;--us:#4c9aff;--them:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;border:0;border-radius:12px;background:var(--panel2);min-height:46px;padding:0 12px;font-weight:600}
button:active{filter:brightness(1.35)}
button:disabled{opacity:.35}
button.pri{background:var(--acc);color:#fff}
button.bad{background:var(--bad);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line)}
input,select,textarea{width:100%;background:#0b121a;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:46px}
label{display:block;margin:10px 0;font-size:14px;color:var(--mut)}
label input,label select{margin-top:4px;color:var(--text)}
h2,h3{margin:8px 0}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:46px;padding:0;font-size:20px}
.sv{font-size:12px;color:var(--good);white-space:nowrap}.sv.busy{color:var(--mut)}.sv.err{color:#ff7b7b;font-weight:800}.sv.ro{color:#ffd27d;font-weight:700}
.nav{display:flex;gap:6px;padding:8px 10px}.nav button{flex:1;min-height:42px;background:var(--panel)}.nav button.on{background:var(--acc);color:#fff}
.pad{padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.card.tap{display:block;width:100%;text-align:left;min-height:64px}
.mut{color:var(--mut);font-size:13px}
.banner{background:#4a3410;border:1px solid var(--warn);border-radius:12px;padding:10px;margin:8px 0;font-size:14px}
.banner.red{background:#4a1416;border-color:var(--bad)}
.gh{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin:16px 2px 2px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}.fchips button{min-height:38px;white-space:nowrap;background:var(--panel)}.fchips button.on{background:var(--acc);color:#fff}
.pill{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--mut);font-weight:600}
.pill.us{background:#173a63;color:#cfe3ff}.pill.them{background:#5a1d20;color:#ffd0d0}.pill.W{background:#123f27;color:#a6f0c6}.pill.L{background:#5a1d20;color:#ffd0d0}
/* live */
.score{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;padding:8px 8px 4px}
.side{background:var(--panel);border-radius:14px;padding:6px;text-align:center;border:2px solid var(--line)}
.side.us{border-color:var(--us)}.side.them{border-color:var(--them)}
.side .lbl{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--mut)}
.side .num{font-size:44px;font-weight:800;line-height:1}
.side button{min-height:34px;font-size:12px;width:100%;margin-top:4px;padding:0 4px}
.mid{background:var(--panel);border-radius:14px;padding:6px;text-align:center;display:flex;flex-direction:column;gap:5px;justify-content:center}
.mid .sl{font-weight:800;font-size:15px}
.chips{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.chips button{min-height:30px;width:32px;padding:0;font-size:14px;border-radius:8px}.chips button.on{background:var(--acc);color:#fff}
.mid .ns{min-height:36px;font-size:13px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;padding:4px 8px}
.pl{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;line-height:1.05;border:2px solid transparent}
.pl b{font-size:22px}.pl small{font-size:10px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pl.on{background:var(--acc);color:#fff;border-color:#fff}.pl.on small{color:#dbe8ff}
.players.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.skills{padding:4px 8px 130px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:stretch}
.rl{display:flex;align-items:center;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase}
.btns{display:flex;gap:6px}.btns button{flex:1;min-height:56px;font-size:17px;padding:0 2px}
.btns .g{background:var(--good);color:#fff}.btns .b{background:var(--bad);color:#fff}.btns .w{background:var(--warn);color:#fff}
.hit{animation:hit .25s}
@keyframes hit{0%{box-shadow:0 0 0 0 #fff;transform:scale(.94)}100%{box-shadow:0 0 0 12px transparent;transform:scale(1)}}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0b121aee;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;z-index:6}
.bar .bl{flex:1;min-width:0;font-size:14px}.bar .bl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selTxt{font-weight:700}.bar button{min-width:110px;min-height:54px;font-size:17px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:8px 0;-webkit-overflow-scrolling:touch}
table.st{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%;white-space:nowrap}
.st th,.st td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);background:var(--panel)}
.st th{font-size:12px;color:var(--mut);position:sticky;top:0;cursor:pointer;background:#111b26}.st th.on{color:#fff;background:var(--acc)}
.st td:nth-child(1),.st th:nth-child(1){position:sticky;left:0;width:40px;min-width:40px;text-align:center;z-index:2}
.st td:nth-child(2),.st th:nth-child(2){position:sticky;left:40px;text-align:left;z-index:2;border-right:1px solid var(--line)}
.st tr.tot td{font-weight:800;background:var(--panel2)}
.log .ev{display:flex;gap:8px;align-items:center;width:100%;text-align:left;min-height:48px;margin:4px 0;background:var(--panel)}
.log .ev .a{flex:1}
/* court */
.court{padding:4px 8px}
.netbar{height:7px;border-radius:4px;margin:0 2px 6px;background:repeating-linear-gradient(90deg,#9fb3c8 0 7px,#3a4b5e 7px 14px);opacity:.55}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cgrid .pl{min-height:60px}
.cgrid.hl{grid-template-columns:repeat(3,1fr) .8fr}
.cgrid.hl .pl.lib{grid-column:4;grid-row:1/3;min-height:0}
.pl.lib{border:2px solid var(--warn)}
.pl.lib.on{border-color:#fff}
.needserve .row:not([data-g=srv]){opacity:.28;pointer-events:none}
.needserve .row[data-g=srv] .btns{outline:2px solid var(--us);outline-offset:3px;border-radius:14px}
.needserve .side button{opacity:.28;pointer-events:none}
.needserve .pl:not(.srv){opacity:.45;pointer-events:none}
.pl{position:relative}
.pl .ps{position:absolute;top:3px;left:7px;font-size:11px;font-style:normal;font-weight:800;color:var(--mut)}
.pl.on .ps{color:#dbe8ff}
.pl.srv::after{content:'🏐';position:absolute;top:2px;right:5px;font-size:13px}
.pl.ro{background:var(--panel2);border-radius:12px}
.lustrip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px;font-size:13px;font-weight:600;min-height:38px}
.lustrip button{min-height:34px;font-size:13px;white-space:nowrap}
/* live screen: compact so every button fits one phone screen */
.live .top{padding:4px 10px}.live .top .ic{min-height:40px}
.live .nav{padding:4px 10px}.live .nav button{min-height:36px}
.live .score{padding:4px 8px 2px}
.live .side .num{font-size:36px}.live .side button{min-height:28px;margin-top:2px}
.live .mid{gap:3px}.live .mid .ns{min-height:30px}.live .chips button{min-height:26px}
.live .lustrip{min-height:32px}.live .lustrip button{min-height:30px}
.live .cgrid .pl{min-height:52px}.live .players{gap:5px}
.live .skills{gap:5px;padding-bottom:84px}.live .btns button{min-height:50px}
.live .bar{padding-top:6px}.live .bar button{min-height:50px}
/* modal */
.mback{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mbox{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
@media(min-width:700px){.mback{align-items:center}.mbox{border-radius:18px}}
.mrow{display:flex;gap:8px;margin-top:12px}.mrow button{flex:1}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cb{display:flex;align-items:center;gap:8px;margin:0;background:#0b121a;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)}.cb input{width:22px;height:22px;min-height:0;margin:0}
.stack button{display:block;width:100%;margin:6px 0;text-align:left;padding:12px}
.center{max-width:420px;margin:12vh auto 0;padding:16px}
.tgl{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:6px 0}
textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
@media(min-width:700px){.btns button{min-height:68px;font-size:20px}.pl{min-height:62px}}
</style>
</head>
<body>
<div id="app"><div class="center"><p class="mut">Loading…</p></div></div>
<script src="config.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $=id=>document.getElementById(id), app=$('app');
const enc=new TextEncoder(), dec=new TextDecoder();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toB64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)}
function fromB64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
const ssDel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};
// per-device preferences (not team data)
let settings={sticky:true,haptic:true,lastBackup:0};
try{Object.assign(settings,JSON.parse(localStorage.getItem('vbs.set')||'{}'))}catch(e){}
const saveSettings=()=>{try{localStorage.setItem('vbs.set',JSON.stringify(settings))}catch(e){}};
let DEV=null;try{DEV=localStorage.getItem('vbs.dev')}catch(e){}
if(!DEV)DEV=ssGet('vbs.dev');
if(!DEV){DEV='d'+Math.random().toString(36).slice(2,7);try{localStorage.setItem('vbs.dev',DEV)}catch(e){}ssSet('vbs.dev',DEV)}

/* ================= state ================= */
let state=defState(),KEY=null,view='boot',mview='live',curId=null,sel=null,loaded=false;
let db=null,col=null,user=null,downloadsCap=null,readOnly=false;
let raw={},synced={};
let lastKey='',lastT=0,lastMsg='',sortKey='num',sortDir=1,statSet='all',statFilter='all',mFilter='all',saveStatus='ok',pending=null,exportData=null;
function defState(){return{players:[],matches:[],events:[]}}
const TYPES=[['league','League'],['tournament','Tournament'],['scrimmage','Scrimmage'],['practice','Practice'],['other','Other']];
const TYPE_LBL=Object.fromEntries(TYPES);

/* ================= definitions ================= */
const GROUPS=[
 {k:'srv',name:'Serve',b:[['ace','Ace','us','g','Serve ace'],['in','In','','','Serve in'],['err','Error','them','b','Serve error']]},
 {k:'rec',name:'Pass',b:[['3','3','','g','Pass 3'],['2','2','','','Pass 2'],['1','1','','w','Pass 1'],['0','0','them','b','Pass 0 (aced / error)']]},
 {k:'att',name:'Attack',b:[['kill','Kill','us','g','Kill'],['swing','Swing','','','Swing (no point)'],['err','Error','them','b','Attack error']]},
 {k:'blk',name:'Block',b:[['stuff','Stuff','us','g','Block point'],['ast','Blk ast','','','Block assist'],['err','Error','them','b','Block error']]},
 {k:'oth',name:'Other',b:[['dig','Dig','','','Dig'],['set','Assist','','','Set assist'],['fault','Fault','them','b','Fault (net/lift/rotation/dig err)']]}
];
const DEF={},LBL={'team.us':'Opponent error (+1 us)','team.them':'Opponent point (+1 them)','lu.sub':'Substitution','lu.rotf':'Rotation corrected (forward)','lu.rotb':'Rotation corrected (back)','lu.svus':'Serve set to: us','lu.svthem':'Serve set to: opponent','lu.lib':'Libero change','lu.sknsv':'Serve result skipped'};
GROUPS.forEach(g=>g.b.forEach(b=>{DEF[g.k+'.'+b[0]]={pt:b[2]};LBL[g.k+'.'+b[0]]=b[4]}));

/* ================= crypto ================= */
// A random data key (KEY) encrypts every team document. The password only wraps that key (stored in 'meta'),
// so changing the password is instant and never re-encrypts data.
async function derive(pw,salt){
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const importK=r=>crypto.subtle.importKey('raw',r,'AES-GCM',true,['encrypt','decrypt']);
async function encWith(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return toB64(iv)+'.'+toB64(ct)}
async function decWith(key,s){const[i,c]=s.split('.');return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(i)},key,fromB64(c)))}
const encStr=s=>encWith(KEY,enc.encode(s));
const decStr=async s=>dec.decode(await decWith(KEY,s));
async function writeMeta(pw,Kraw,chk){
  const salt=crypto.getRandomValues(new Uint8Array(16));const pk=await derive(pw,salt);
  await col.doc('meta').set({salt:toB64(salt),wrap:await encWith(pk,Kraw),chk});
}
async function unwrap(pw){
  const m=raw.meta;if(!m)return null;
  try{const pk=await derive(pw,fromB64(m.salt));const Kr=await decWith(pk,m.wrap);const K=await importK(Kr);await decWith(K,m.chk);return{K,Kr}}catch(e){return null}
}

/* ================= remote model & sync ================= */
const sortEvents=()=>state.events.sort((a,b)=>a.ts-b.ts||(a.id<b.id?-1:1));
// short content hash: lets us remember what the server holds without keeping a second copy
const H=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)+'.'+s.length};
// Tab-session safety net: the working copy (including taps not yet sent) is mirrored into this tab's
// sessionStorage, so an accidental refresh restores it. Closing the tab clears it, by design.
const SNAP='vbs.snap';let snapTimer=null,ssOK=true,needReconcile=false,pendingN=0;
function saveSnap(){
  clearTimeout(snapTimer);
  if(!KEY||!loaded)return;
  try{sessionStorage.setItem(SNAP,JSON.stringify({v:1,state,sync:synced,meta:raw.meta||null,ro:readOnly,team:teamId||'',nav:{view,curId,mview,sel,mFilter,statFilter}}));ssOK=true}catch(e){ssOK=false}
}
const saveSnapSoon=()=>{clearTimeout(snapTimer);snapTimer=setTimeout(saveSnap,150)};
function loadSnap(){try{const s=JSON.parse(sessionStorage.getItem(SNAP)||'null');return s&&s.v===1&&s.meta?s:null}catch(e){return null}}
window.addEventListener('pagehide',saveSnap);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveSnap()});
const tmo=(p,ms=15000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'unavailable',message:'timeout'}),ms))]);
function computeRemote(){
  const out={roster:JSON.stringify(state.players)};
  state.matches.forEach(m=>{out['m_'+m.id]=JSON.stringify(m)});
  const by={};state.events.forEach(v=>{(by[v.c]||(by[v.c]=[])).push(v)});
  for(const c in by)out['e_'+c]=JSON.stringify(by[c]);
  return out;
}
function applyDoc(id,R){
  if(id==='roster'){state.players=R==null?[]:JSON.parse(R);return}
  if(id.startsWith('m_')){
    const mid=id.slice(2);state.matches=state.matches.filter(m=>m.id!==mid);
    if(R==null){state.events=state.events.filter(v=>v.m!==mid)}else state.matches.push(JSON.parse(R));
    return;
  }
  if(id.startsWith('e_')){
    const c=id.slice(2);state.events=state.events.filter(v=>v.c!==c);
    if(R!=null)state.events.push(...JSON.parse(R).map(v=>Object.assign(v,{c})));
    sortEvents();
  }
}
async function bulkLoad(){
  state=defState();synced={};
  for(const id in raw){
    if(id==='meta'||!raw[id]||!raw[id].e)continue;
    try{const R=await decStr(raw[id].e);applyDoc(id,R);synced[id]=H(R)}catch(e){console.warn('could not read',id)}
  }
  sortEvents();loaded=true;saveSnap();
}
let ingestQ=Promise.resolve();
function ingestMany(ids){
  ingestQ=ingestQ.then(async()=>{
    const local=computeRemote();let changed=false;
    for(const id of ids){
      let R=null;
      try{if(raw[id]&&raw[id].e)R=await decStr(raw[id].e)}catch(e){continue}
      const L=local[id],S=synced[id];
      const Rh=R==null?undefined:H(R),Lh=L==null?undefined:H(L);
      if(Rh===Lh){if(Rh==null)delete synced[id];else synced[id]=Rh;continue}
      if(Lh!==S)continue;                      // we have unsent local edits to this doc: ours win
      applyDoc(id,R);if(R==null){delete synced[id];delete local[id]}else{synced[id]=Rh;local[id]=R}
      changed=true;
    }
    if(changed){saveSnapSoon();refreshUI()}
  }).catch(e=>console.error(e));
}
function onColSnap(snap){
  const ids=[];
  snap.docChanges().forEach(ch=>{const id=ch.doc.id;if(ch.type==='removed')delete raw[id];else raw[id]=ch.doc.data();if(id!=='meta')ids.push(id)});
  if(!KEY){
    if(view==='notready'&&raw.meta){view='lock';render()}
    else if((view==='lock')&&!raw.meta){view=readOnly?'notready':'setup';render()}
    return;
  }
  if(loaded){
    let all=ids;
    // after a restore, the first server-definitive snapshot also tells us about docs deleted remotely meanwhile
    if(needReconcile&&!(snap.metadata&&snap.metadata.fromCache)){needReconcile=false;all=[...new Set([...ids,...Object.keys(synced)])]}
    if(all.length)ingestMany(all);
  }
}
let syncTimer=null,syncing=false,gen=0;
function markDirty(){if(readOnly||!KEY||!loaded)return;gen++;setSave('busy');saveSnapSoon();clearTimeout(syncTimer);syncTimer=setTimeout(pushSync,600)}
async function pushSync(){
  if(syncing){syncTimer=setTimeout(pushSync,300);return}
  syncing=true;const g=gen;
  try{
    const local=computeRemote();
    const ops=Object.keys(local).filter(id=>H(local[id])!==synced[id]);
    const dels=Object.keys(synced).filter(id=>!(id in local));
    pendingN=ops.length+dels.length;
    if(!col)throw{code:'unavailable',message:'not connected'};
    for(const id of ops){const body={e:await encStr(local[id])};await tmo(col.doc(id).set(body));synced[id]=H(local[id])}
    for(const id of dels){await tmo(col.doc(id).delete());delete synced[id]}
    saveSnap();
    if(g!==gen){syncTimer=setTimeout(pushSync,200)}else{pendingN=0;setSave('ok')}
  }catch(err){
    console.error(err);saveSnap();
    if(err&&err.code==='invalid_argument'){readOnly=true;setSave('ro');refreshUI(true)}
    else{permDenied(err);setSave('err');syncTimer=setTimeout(pushSync,4000)}
  }finally{syncing=false}
}
function setSave(s){
  saveStatus=readOnly?'ro':s;const el=$('sv');if(!el)return;
  const t={ok:'● Synced',busy:'◌ Saving…',err:'⚠ Offline · kept on device',ro:'👁 View only'}[saveStatus];

function localCol(name){
  const K='vbs.local.'+name,subs=new Set();
  const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}};
  const fire=()=>subs.forEach(f=>f());
  window.addEventListener('storage',e=>{if(e.key===K)fire()});
  return{
    doc:id=>({
      set:async d=>{const o=read();o[id]=JSON.parse(JSON.stringify(d));localStorage.setItem(K,JSON.stringify(o));fire()},
      delete:async()=>{const o=read();delete o[id];localStorage.setItem(K,JSON.stringify(o));fire()}}),
    onSnapshot(next){
      let prev={};
      const f=()=>{const cur=read(),ch=[];
        for(const id in cur)if(!(id in prev)||JSON.stringify(prev[id])!==JSON.stringify(cur[id]))ch.push({type:id in prev?'modified':'added',doc:{id,data:()=>cur[id]}});
        for(const id in prev)if(!(id in cur))ch.push({type:'removed',doc:{id,data:()=>prev[id]}});
        prev=cur;next({docChanges:()=>ch,metadata:{fromCache:false}})};
      subs.add(f);setTimeout(f,0);return()=>subs.delete(f);
    }};
}
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]'))return res();const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(el)});

async function connectDB(){

    backend='claude';
    try{user=await claude.use('user')}catch(e){user=null}

/* ================= stats ================= */
const fresh=()=>({ace:0,se:0,sin:0,r3:0,r2:0,r1:0,r0:0,k:0,e:0,sw:0,bs:0,ba:0,be:0,dig:0,ast:0,fault:0});
function fin(s){s.rn=s.r3+s.r2+s.r1+s.r0;s.rec=s.rn?(3*s.r3+2*s.r2+s.r1)/s.rn:null;s.ta=s.k+s.e+s.sw;s.hit=s.ta?(s.k-s.e)/s.ta:null;s.pts=s.ace+s.k+s.bs;s.err=s.se+s.e+s.be+s.fault+s.r0;return s}
function calc(evs){
  const S={};
  for(const v of evs){
    if(!v.p||v.k==='lu')continue;const s=S[v.p]||(S[v.p]=fresh());
    switch(v.k+'.'+v.r){
      case'srv.ace':s.ace++;break;case'srv.in':s.sin++;break;case'srv.err':s.se++;break;
      case'rec.3':s.r3++;break;case'rec.2':s.r2++;break;case'rec.1':s.r1++;break;case'rec.0':s.r0++;break;
      case'att.kill':s.k++;break;case'att.swing':s.sw++;break;case'att.err':s.e++;break;
      case'blk.stuff':s.bs++;break;case'blk.ast':s.ba++;break;case'blk.err':s.be++;break;
      case'oth.dig':s.dig++;break;case'oth.set':s.ast++;break;case'oth.fault':s.fault++;break;
    }
  }
  for(const id in S)fin(S[id]);
  return S;
}
function score(mid,set){let us=0,them=0;for(const v of state.events){if(v.m===mid&&v.s===set){if(v.pt==='us')us++;else if(v.pt==='them')them++}}return{us,them}}
function setsWL(m){let w=0,l=0;for(let s=1;s<=m.nsets;s++){if(s<m.nsets||m.done){const c=score(m.id,s);if(c.us>c.them)w++;else if(c.them>c.us)l++}}return{w,l}}
const P=id=>state.players.find(p=>p.id===id);
const plabel=p=>p?'#'+p.num+(p.name?' '+p.name:''):'(removed player)';
const numVal=n=>{const x=parseInt(n,10);return isNaN(x)?9999:x};
const sortedPlayers=list=>list.slice().sort((a,b)=>numVal(a.num)-numVal(b.num)||String(a.num).localeCompare(String(b.num)));
const curMatch=()=>state.matches.find(m=>m.id===curId);
const fmtHit=h=>h==null?'–':(h<0?'-':'')+Math.abs(h).toFixed(3).replace(/^0/,'');
const COLS=[['num','#'],['name','Player'],['pts','Pts'],['ace','Ace'],['se','SE'],['rec','Pass'],['rn','PN'],['k','K'],['e','E'],['ta','TA'],['hit','Hit%'],['bs','BS'],['ba','BA'],['dig','Dig'],['ast','Ast'],['err','Err']];
function cell(k,p,s){
  if(k==='num')return p?esc(p.num):'';
  if(k==='name')return p?esc(p.name||'—'):'TEAM';
  if(k==='hit')return fmtHit(s.hit);
  if(k==='rec')return s.rec==null?'–':s.rec.toFixed(2);
  return s[k];
}
function buildRows(evs){
  const S=calc(evs),rows=[];
  for(const id in S)rows.push({p:P(id)||{id,num:'?',name:'removed'},s:S[id]});
  const T=fresh();rows.forEach(r=>{for(const k in T)T[k]+=r.s[k]});fin(T);
  rows.sort((a,b)=>{
    if(sortKey==='num')return sortDir*(numVal(a.p.num)-numVal(b.p.num));
    if(sortKey==='name')return sortDir*String(a.p.name).localeCompare(String(b.p.name));
    let x=a.s[sortKey],y=b.s[sortKey];x=x==null?-9:x;y=y==null?-9:y;return -sortDir*(x-y)||numVal(a.p.num)-numVal(b.p.num);
  });
  return{rows,T};
}
function statsHTML(evs){

/* ---- lineup / rotation ----
   Court numbering (net at top): front row 4-3-2, back row 5-6-1; position 1 serves.
   The live rotation is replayed from the set's starting lineup + the recorded events, so Undo / Log edits stay consistent:
   we rotate when we win a rally the opponent served (side-out): 2→1→6→5→4→3→2.
   The libero sits beside the court (not in a position) and is always selectable.
   While we serve, each rally must start with the server's serve result (needServe). */
const ORDER=[4,3,2,5,6,1];
const rotF=a=>{a.push(a.shift())},rotB=a=>{a.unshift(a.pop())};
function lineupOf(m,set){
  const L=m.lu&&m.lu[set];if(!L||!L.pos||L.pos.length!==6)return null;
  const pos=L.pos.slice();let serving=L.serve||'us',lib=L.lib||null,served=false;
  for(const v of state.events){
    if(v.m!==m.id||v.s!==set)continue;
    if(v.k==='lu'){
      if(v.r==='sub'){const i=pos.indexOf(v.o);if(i>=0)pos[i]=v.p}
      else if(v.r==='rotf')rotF(pos);else if(v.r==='rotb')rotB(pos);
      else if(v.r==='svus'){serving='us';served=false}else if(v.r==='svthem')serving='them';
      else if(v.r==='lib')lib=v.p||null;
      else if(v.r==='sknsv')served=true;
      continue;
    }
    if(v.k==='srv')served=true;
    if(v.pt==='us'){if(serving==='them')rotF(pos);serving='us';served=false}
    else if(v.pt==='them'){serving='them';served=false}
  }
  return{pos,lib,serving,served,needServe:serving==='us'&&!served};
}
const needServe=()=>{const m=curMatch();const L=m&&lineupOf(m,m.cur);return L&&L.needServe?L:null};
const chipInner=(pl,tag)=>`<i class="ps">${tag}</i><b>${esc(pl?pl.num:'?')}</b><small>${esc(pl?pl.name:'')}</small>`;

  const cell=(id,tag,cls)=>{const pl=P(id),inner=chipInner(pl,tag);
    return ro?`<div class="pl ro ${cls}">${inner}</div>`:`<button class="pl ${cls} ${id===sel?'on':''}" data-a="pl" data-id="${id}">${inner}</button>`};
  return`<div id="players" class="court"><div class="netbar"></div><div class="cgrid ${L.lib?'hl':''}">${ORDER.map(p=>cell(L.pos[p-1],p,p===1&&L.serving==='us'?'srv':'')).join('')}${L.lib?cell(L.lib,'L','lib'):''}</div></div>`;
}
function playersBlock(m){

function buzz(){if(settings.haptic&&navigator.vibrate){try{navigator.vibrate(14)}catch(e){}}}
function flash(el){if(!el)return;el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}
function chunkFor(mid){
  for(let i=state.events.length-1;i>=0;i--){const v=state.events[i];if(v.m===mid&&mine(v)){let n=0;for(const x of state.events)if(x.c===v.c)n++;if(n<50)return v.c;break}}

}
function addEvent(ev,btn){
  if(readOnly)return;

  const v=Object.assign({id:uid(),ts:nextTs(),m:m.id,s:m.cur,c:chunkFor(m.id)},ev);

  lastMsg=(v.p?plabel(P(v.p))+' · ':'')+LBL[v.k+'.'+v.r]+'  →  '+sc.us+'–'+sc.them;

  const key=k+r+sel,now=Date.now();

/* ---- demo data (Settings → Testing): made-up games from the current roster, tagged demo:true so they can be removed ---- */
function genDemo(){
  const R=Math.random,ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)];
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const wpick=(arr,wf)=>{const w=arr.map(wf);let x=R()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i]}return arr[arr.length-1]};
  const roster=state.players.filter(p=>!p.arch);
  if(roster.length<7){info('Add at least 7 players to the roster first.');return 0}
  const specs=shuffle([
    ...Array.from({length:6},()=>({fmt:'p',type:pick(['practice','practice','scrimmage'])})),
    ...Array.from({length:7},()=>({fmt:'b3',type:pick(['league','league','scrimmage'])})),
    ...Array.from({length:7},()=>({fmt:'b5',type:pick(['league','tournament','tournament'])}))]);
  const opps=shuffle(['Falcons','Hawks','Wolves','Storm','Thunder','Raptors','Vipers','Titans','Comets','Blaze','Rebels','Jets']);
  const evNames=['Calgary Cup','Fall Classic'];const evDate={};
  const out={matches:[],events:[]};
  specs.forEach((sp,gi)=>{
    const dt=new Date(Date.now()-(72-gi*3.4-ri(0,2))*864e5);
    let date=new Date(dt.getTime()-dt.getTimezoneOffset()*6e4).toISOString().slice(0,10),ev='';
    if(sp.type==='tournament'){ev=evNames[gi%2];if(evDate[ev])date=evDate[ev];else evDate[ev]=date}
    const m={id:uid(),ts:Date.now()+gi,type:sp.type,ev,opp:opps[gi%opps.length],date,pids:shuffle(roster).slice(0,ri(8,roster.length)).map(p=>p.id),nsets:0,cur:1,done:true,lu:{},demo:true};
    const wr=0.43+R()*0.17;let t=new Date(date+'T19:00:00').getTime();const evs=[];
    const push=(e,s)=>{t+=ri(6,18)*1000;evs.push(Object.assign({id:uid(),ts:t,m:m.id,s,c:'demo'+gi+'_'+Math.floor(evs.length/300),pt:''},e))};
    const simRally=(c)=>{
      const{pos,lib,serving,s}=c,front=[pos[1],pos[2],pos[3]],back=[pos[4],pos[5],pos[0]];
      const att=()=>wpick(pos,id=>front.includes(id)?3:1),oth=x=>pick(pos.filter(y=>y!==x)),back3=()=>lib&&R()<.4?lib:wpick(pos,id=>back.includes(id)?3:1);
      const E=(p,k,r,pt)=>push({p,k,r,pt:pt||''},s);
      if(serving==='us'){const sv=pos[0],x=R();if(x<.08){E(sv,'srv','ace','us');return'us'}if(x<.2){E(sv,'srv','err','them');return'them'}E(sv,'srv','in')}
      else{const pr=back3(),x=R(),r=x<.3?'3':x<.7?'2':x<.9?'1':'0';if(r==='0'){E(pr,'rec','0','them');return'them'}E(pr,'rec',r)}
      const win=R()<c.wr;
      if(R()<.45)E(back3(),'oth','dig');
      if(R()<.6){const a=att();E(oth(a),'oth','set');E(a,'att','swing')}
      if(win){const x=R();
        if(x<.62){const a=att();if(R()<.75)E(oth(a),'oth','set');E(a,'att','kill','us')}
        else if(x<.75){const b=pick(front);if(R()<.35)E(pick(front.filter(y=>y!==b)),'blk','ast');E(b,'blk','stuff','us')}
        else push({p:null,k:'team',r:'us',pt:'us'},s);
        return'us'}
      const x=R();
      if(x<.25)E(att(),'att','err','them');else if(x<.30)E(pick(front),'blk','err','them');else if(x<.40)E(pick(pos),'oth','fault','them');
      else push({p:null,k:'team',r:'them',pt:'them'},s);
      return'them';
    };
    const simSet=(s,target,firstServe)=>{
      const six=shuffle(m.pids).slice(0,6),rest=m.pids.filter(x=>!six.includes(x));
      const lib=rest.length&&R()<.65?pick(rest):null;let bench=rest.filter(x=>x!==lib);
      let serving=firstServe;m.lu[s]={pos:six.slice(),serve:serving,lib};
      const pos=six.slice(),subAt=R()<.4?ri(6,30):-1;let us=0,them=0,n=0;
      while(!((us>=target||them>=target)&&Math.abs(us-them)>=2)){
        n++;
        if(n===subAt&&bench.length){const i=ri(0,5),out_=pos[i],in_=pick(bench);pos[i]=in_;bench=bench.filter(x=>x!==in_).concat(out_);push({p:in_,o:out_,k:'lu',r:'sub'},s)}
        const w=simRally({pos,lib,serving,s,wr:Math.min(.7,Math.max(.3,wr+(R()-.5)*.05))});
        if(w==='us'){if(serving==='them')rotF(pos);serving='us';us++}else{serving='them';them++}
      }
      return{us,them,serve0:m.lu[s].serve};
    };
    let wins=0,loss=0,s=0,first=R()<.5?'us':'them';
    const need=sp.fmt==='b3'?2:sp.fmt==='b5'?3:0;
    if(sp.fmt==='p'){const sets=R()<.6?1:2,tg=sets===1?15:12;for(let i=0;i<sets;i++){s++;const r=simSet(s,tg,first);first=first==='us'?'them':'us'}}
    else while(wins<need&&loss<need){s++;const tg=(sp.fmt==='b5'&&s===5)?15:25;const r=simSet(s,tg,s===5?(R()<.5?'us':'them'):first);if(r.us>r.them)wins++;else loss++;first=first==='us'?'them':'us'}
    m.nsets=s;m.cur=s;out.matches.push(m);out.events.push(...evs);
  });
  state.matches.push(...out.matches);state.events.push(...out.events);sortEvents();markDirty();render();
  return out.matches.length;
}
function removeDemo(){
  const ids=new Set(state.matches.filter(m=>m.demo).map(m=>m.id));

  markDirty();render();return ids.size;
}
